name: Assemble next-program evidence

on:
  push:
    branches:
      - main
    paths:
      - ".evidence-upload/next-program/**"

permissions:
  contents: write

concurrency:
  group: next-program-evidence-assembly
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect the staged payload
        id: payload
        shell: bash
        run: |
          if compgen -G ".evidence-upload/next-program/*.part-*" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and verify evidence
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .evidence-upload/next-program/natural_nulls.part-* > reports/next_program/iclr/natural_nulls.csv
          cat .evidence-upload/next-program/full_model_nulls.part-* > reports/next_program/iclr/full_model_nulls.csv
          printf '%s  %s\n' \
            '1931dad94c6b1289ec0c21cf403387ba1348ecbbf4fc100a772d87c6f94d0d97' \
            'reports/next_program/iclr/natural_nulls.csv' \
            'fbcb4440c6c8bd2610e1ecdca146cd6c4d9a4e588a82102560583f7faaa8fd67' \
            'reports/next_program/iclr/full_model_nulls.csv' | sha256sum --check --strict
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          release_path = Path("reports/next_program/release.json")
          release = json.loads(release_path.read_text(encoding="utf-8"))
          release["status"] = "published"
          release["tag_target"] = "assembled_evidence_commit"
          release_path.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          manifest_path = Path("reports/next_program/artifact_checksums.csv")
          rows = list(csv.reader(manifest_path.open(newline="", encoding="utf-8")))
          size = release_path.stat().st_size
          digest = hashlib.sha256(release_path.read_bytes()).hexdigest()
          for row in rows:
              if row and row[0] == release_path.as_posix():
                  row[1:] = [str(size), digest]
                  break
          else:
              raise SystemExit("release.json is absent from artifact_checksums.csv")
          with manifest_path.open("w", newline="", encoding="utf-8") as handle:
              csv.writer(handle, lineterminator="\n").writerows(rows)

          failures = []
          for path_text, expected_size, expected_digest in rows[1:]:
              path = Path(path_text)
              actual_size = path.stat().st_size
              actual_digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_size != int(expected_size) or actual_digest != expected_digest:
                  failures.append(path_text)
          if failures:
              raise SystemExit("checksum verification failed: " + ", ".join(failures))
          print(f"verified {len(rows) - 1} artifact checksums")
          PY
          rm -rf .evidence-upload/next-program
          rmdir .evidence-upload

      - name: Commit evidence and create the release tag
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/next_program .evidence-upload
          git commit -m "Record next experimental program evidence"
          git fetch origin main
          git rebase origin/main
          git tag -a next-program-4ab8022b5c78 -m "Next TwistedMerge experimental program"
          git push --atomic origin HEAD:main refs/tags/next-program-4ab8022b5c78
